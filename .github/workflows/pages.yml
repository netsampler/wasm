name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wasm
        uses: actions/checkout@v4
        with:
          path: wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wasm/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            wasm/apps/goflow2/wasm/go.sum
            wasm/apps/reflow/wasm/go.sum

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: wasm
        run: npm ci

      - name: Test GoFlow2 WASM
        working-directory: wasm
        run: npm run test:wasm:goflow2

      - name: Test ReFlow WASM
        working-directory: wasm
        run: npm run test:wasm:reflow

      - name: Build site
        working-directory: wasm
        env:
          VITE_BASE_PATH: /wasm/
          GOFLOW2_WASM_PATH: /wasm/goflow2.wasm
          GOFLOW2_WASM_EXEC_PATH: /wasm/wasm_exec.js
          REFLOW_WASM_PATH: /wasm/reflow.wasm
          REFLOW_WASM_EXEC_PATH: /wasm/wasm_exec.js
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wasm/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
